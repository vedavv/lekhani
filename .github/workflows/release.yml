name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        ENCODED_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo $ENCODED_KEYSTORE | base64 -d > release-keystore.jks

    - name: Build all release APKs
      env:
        RELEASE_STORE_FILE: ../release-keystore.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        ./gradlew assembleSanskritRelease
        ./gradlew assembleHindiRelease
        ./gradlew assembleTeluguRelease
        ./gradlew assembleKannadaRelease

    - name: Build all release AABs
      env:
        RELEASE_STORE_FILE: ../release-keystore.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        ./gradlew bundleSanskritRelease
        ./gradlew bundleHindiRelease
        ./gradlew bundleTeluguRelease
        ./gradlew bundleKannadaRelease

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          app/build/outputs/apk/sanskrit/release/*.apk
          app/build/outputs/apk/hindi/release/*.apk
          app/build/outputs/apk/telugu/release/*.apk
          app/build/outputs/apk/kannada/release/*.apk
          app/build/outputs/bundle/sanskritRelease/*.aab
          app/build/outputs/bundle/hindiRelease/*.aab
          app/build/outputs/bundle/teluguRelease/*.aab
          app/build/outputs/bundle/kannadaRelease/*.aab
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
